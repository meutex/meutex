<svg xmlns="http://www.w3.org/2000/svg" width="840" height="96" viewBox="0 0 840 96" role="img" aria-label="Languages by lines changed: TypeScript 51%, Python 36%, Rust 12%"><title>Languages by lines changed: TypeScript 51%, Python 36%, Rust 12%</title><style>
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
@keyframes twinkle { 0%, 100% { opacity: .15 } 50% { opacity: .9 } }
@keyframes ping { from { transform: scale(1); opacity: .7 } to { transform: scale(2.8); opacity: 0 } }
@keyframes blink { 50% { opacity: 0 } }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s cubic-bezier(.4,0,.2,1) forwards }
.rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both }
.fade { animation: fade .6s ease-out both }
.grow { transform-box: fill-box; transform-origin: left; animation: grow 1.2s cubic-bezier(.4,0,.2,1) both }
.breathe { animation: breathe 6s ease-in-out infinite }
.twinkle { animation: twinkle 3.2s ease-in-out infinite }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2s cubic-bezier(0,0,.2,1) infinite }
.typing { transform-box: fill-box; transform-origin: left }
@media (prefers-reduced-motion: reduce) {
  .rise, .fade, .grow, .breathe, .twinkle, .ping, .typing, .caret { animation: none }
  .draw { animation: none; stroke-dashoffset: 0 }
}
