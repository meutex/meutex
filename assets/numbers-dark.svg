<svg xmlns="http://www.w3.org/2000/svg" width="840" height="124" viewBox="0 0 840 124" role="img" aria-label="Headline figures"><title>Headline figures</title><style>
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes pop { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: none } }
@keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
@keyframes twinkle { 0%, 100% { opacity: .15 } 50% { opacity: .9 } }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s cubic-bezier(.4,0,.2,1) forwards }
.rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.4,.5,1) both }
.grow { transform-box: fill-box; transform-origin: left; animation: grow 1.2s cubic-bezier(.4,0,.2,1) both }
.breathe { animation: breathe 6s ease-in-out infinite }
.twinkle { animation: twinkle 3.2s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) {
  .rise, .pop, .grow, .breathe, .twinkle { animation: none }
  .draw { animation: none; stroke-dashoffset: 0 }
}
</style><rect x="0.5" y="0.5" width="839" height="123" rx="14" fill="#08080a" stroke="#1c1c21"/><g class="rise" style="animation-delay:0ms"><text x="42.0" y="40.0" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#6a6a70" text-anchor="start" letter-spacing="1.4">COMBINED STARS</text><text x="42.0" y="80.0" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="34" font-weight="650" fill="#f4f4f5" text-anchor="start" letter-spacing="-1">241k</text><text x="42.0" y="100.0" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a3a3a8" text-anchor="start" >of projects contributed to</text></g><line x1="222.0" y1="28" x2="222.0" y2="96" stroke="#1c1c21"/><g class="rise" style="animation-delay:120ms"><text x="240.0" y="40.0" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#6a6a70" text-anchor="start" letter-spacing="1.4">MERGED UPSTREAM</text><text x="240.0" y="80.0" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="34" font-weight="650" fill="#f4f4f5" text-anchor="start" letter-spacing="-1">3</text><text x="240.0" y="100.0" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a3a3a8" text-anchor="start" >into 2 projects</text></g><line x1="420.0" y1="28" x2="420.0" y2="96" stroke="#1c1c21"/><g class="rise" style="animation-delay:240ms"><text x="438.0" y="40.0" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#6a6a70" text-anchor="start" letter-spacing="1.4">LINES WRITTEN</text><text x="438.0" y="80.0" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="34" font-weight="650" fill="#f4f4f5" text-anchor="start" letter-spacing="-1">1,800</text><text x="438.0" y="100.0" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a3a3a8" text-anchor="start" >across 14 commits</text></g><line x1="618.0" y1="28" x2="618.0" y2="96" stroke="#1c1c21"/><g class="rise" style="animation-delay:360ms"><text x="636.0" y="40.0" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#6a6a70" text-anchor="start" letter-spacing="1.4">PROJECTS</text><text x="636.0" y="80.0" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="34" font-weight="650" fill="#f4f4f5" text-anchor="start" letter-spacing="-1">3</text><text x="636.0" y="100.0" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a3a3a8" text-anchor="start" >Python · TypeScript</text></g></svg>