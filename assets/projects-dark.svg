@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes pop { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: none } }
@keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
@keyframes twinkle { 0%, 100% { opacity: .15 } 50% { opacity: .9 } }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s cubic-bezier(.4,0,.2,1) forwards }
.rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.4,.5,1) both }
.grow { transform-box: fill-box; transform-origin: left; animation: grow 1.2s cubic-bezier(.4,0,.2,1) both }
.breathe { animation: breathe 6s ease-in-out infinite }
.twinkle { animation: twinkle 3.2s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) {
  .rise, .pop, .grow, .breathe, .twinkle { animation: none }
  .draw { animation: none; stroke-dashoffset: 0 }
}
